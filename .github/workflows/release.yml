name: Release

# Build installers for Windows, macOS, and Linux when a version tag is pushed.
# Example:
#   git tag -a v0.1.2 -m "Release v0.1.2"
#   git push origin v0.1.2
#
# Requires repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          — minisign private key (file contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional; empty if the key has no password
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Create one release up front so matrix jobs do not race into duplicate releases.
  # Published immediately so /releases/latest and the in-app updater see it when builds finish.
  create-release:
    name: Create release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lados ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Offline-first password manager for Windows, macOS, and Linux.

            Download the asset for your platform below. Build from source if you want to verify the binary against this tag.

  publish:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            args: "--features sync"
          - name: linux
            platform: ubuntu-22.04
            args: "--features sync"
          - name: macos-aarch64
            platform: macos-latest
            args: "--target aarch64-apple-darwin --features sync"
          - name: macos-x86_64
            platform: macos-latest
            args: "--target x86_64-apple-darwin --features sync"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Declared explicitly so a *released* build's sync server is stated in a reviewable file
          # and cannot drift from the source default. Every published release points here; staging
          # and red-team clients are built by hand (LADOS_SYNC_SERVER + LADOS_CHANNEL=staging) and
          # are never published as a release. See sync-server/wrangler.toml.
          LADOS_SYNC_SERVER: https://lados-sync.ladospwm.workers.dev
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # ----- Code signing (Windows) — SignPath Foundation ------------------------
      # Free Authenticode signing for open source. NOT ACTIVE YET: it needs a
      # SignPath account with an approved project + signing policy, and the repo
      # secrets SIGNPATH_API_TOKEN and SIGNPATH_ORG_ID. Until then, SmartScreen
      # shows "Unknown publisher" for the unsigned installer.
      #
      # When it is approved, the flow changes from "build and upload" to
      # "build -> sign -> upload", because tauri-action uploads the installer
      # directly today. Sketch of the change (see docs/CODE-SIGNING.md):
      #
      #   - name: Build (unsigned)
      #     uses: tauri-apps/tauri-action@v1
      #     with:
      #       args: ${{ matrix.args }}
      #       releaseId: ${{ needs.create-release.outputs.release_id }}
      #       uploadUpdaterJson: false          # upload after signing
      #
      #   - name: Sign the Windows installers
      #     if: matrix.platform == 'windows-latest'
      #     uses: signpath/github-action-submit-signing-request@v1
      #     with:
      #       api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #       organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #       project-slug: lados
      #       signing-policy-slug: release-signing
      #       github-artifact-name: ${{ matrix.name }}
      #       wait-for-completion: true
      #       output-artifact-directory: signed
      #
      #   - name: Upload the signed installers (and latest.json)
      #     ...attach the files from ./signed to the release...
      #
      # Note: the ${TAURI_SIGNING_*} secrets above are for the in-app UPDATER
      # (minisign). They are unrelated to Authenticode / SmartScreen.
